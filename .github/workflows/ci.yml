name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py xlinebot
      - run: if [ -d tests ]; then python -m unittest discover -s tests -v; else echo 'No tests directory; skipping unittest discovery.'; fi
